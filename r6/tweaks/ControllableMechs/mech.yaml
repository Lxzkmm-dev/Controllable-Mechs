# Controllable Mechs - records the piloted mech uses (TweakXL)
# The Minotaur's secondary: a missile strike at the reticle point. The explosion's
# damage is added from script when it lands (CMUMinotaur.Detonate), with V as the
# instigator, so the record carries none of its own.
Attacks.CM_Missile:
  $base: Attacks.BaseProjectileAoEAttack
  effectTag: explosion_round_charged
  range: 5.0
  damageType: DamageTypes.Physical
  statModifiers: []
  statusEffects: []

# The Octant's weapons (CMUDrone): each mortar round's blast, and a machine-gun round's
# hit on what it struck (a tight area at the hit point, only when the round's ray struck
# something; the missile uses CM_Missile). Damage is added from script, V the instigator.
Attacks.CM_Mortar:
  $base: Attacks.BaseProjectileAoEAttack
  effectTag: explosion_round_charged
  range: 6.0
  damageType: DamageTypes.Physical
  statModifiers: []
  statusEffects: []

Attacks.CM_DroneRound:
  $base: Attacks.BaseProjectileAoEAttack
  effectTag: explosion_round_charged
  range: 0.6
  damageType: DamageTypes.Physical
  statModifiers: []
  statusEffects: []

# The Bombus's payloads (CMUDrone.Detonate). The game's frag and EMP grenade records take
# their damage from a thrown grenade's stats, so with no grenade the damage added from
# script came to nothing (Omar: only the toxic gas, whose damage is its poison, hurt). These
# carry the damage the way the Octant's mortar does; the shock also sends the EMP grenade's
# own attack for its status.
Attacks.CM_BombusFrag:
  $base: Attacks.BaseProjectileAoEAttack
  effectTag: explosion_round_charged
  range: 5.0
  damageType: DamageTypes.Physical
  statModifiers: []
  statusEffects: []

Attacks.CM_BombusHE:
  $base: Attacks.BaseProjectileAoEAttack
  effectTag: explosion_round_charged
  range: 9.0
  damageType: DamageTypes.Physical
  statModifiers: []
  statusEffects: []

Attacks.CM_BombusShock:
  $base: Attacks.BaseProjectileAoEAttack
  effectTag: explosion_round_charged
  range: 7.0
  damageType: DamageTypes.Electric
  statModifiers: []
  statusEffects: []
