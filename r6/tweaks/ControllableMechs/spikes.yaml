# Controllable Mechs - dev spike records (TweakXL)
# S2b: one HMG round's hit, applied at the impact point with V as the instigator.
# Damage is added from script per round (CMSpike2System.HitAt), so the record
# carries none of its own and no status effects.
Attacks.CM_SpikeHMGRound:
  $base: Attacks.BaseProjectileAoEAttack
  range: 0.8
  damageType: DamageTypes.Physical
  statModifiers: []
  statusEffects: []
